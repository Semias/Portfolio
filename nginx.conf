server {
    listen       3300;
    listen  [::]:3300;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't leak the nginx version in error pages / headers
    server_tokens off;

    # Relative Location headers: behind the reverse proxy, nginx doesn't know the public host/port
    absolute_redirect off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      font/woff font/woff2 application/font-woff;

    # Prerendered pages, same as on Cloudflare: /imprint -> imprint/index.html,
    # /imprint/ redirects to /imprint, unknown paths get the 404 page with status 404.
    # HTML must never be cached, or clients keep loading old bundles.
    location / {
        rewrite ^(.+)/$ $1 redirect;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # German pages get the German 404 page
    location /de/ {
        rewrite ^(.+)/$ $1 redirect;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        error_page 404 /de/404.html;
    }

    error_page 404 /404.html;

    # Hashed build assets can be cached forever
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
