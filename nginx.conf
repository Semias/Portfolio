server {
    listen       3300;
    listen  [::]:3300;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't leak the nginx version in error pages / headers
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      font/woff font/woff2 application/font-woff;

    # SPA fallback: unknown paths are handled by the Vue app, not by nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The entry point must never be cached, or clients keep loading old bundles
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
