<article>
  <p class="meta">
    <span class="tag">#{{ tag() }}</span>
    @if (date(); as date) {
      <time [attr.datetime]="post().date">{{ date }}</time>
    }
  </p>
  <h3>
    @if (post().published) {
      <a [routerLink]="path()">{{ post().title }}</a>
    } @else {
      {{ post().title }}
    }
  </h3>
  <p class="excerpt">{{ post().excerpt }}</p>
  @if (!post().published) {
    <p class="soon">{{ t().writing.comingSoon }}</p>
  }
</article>
