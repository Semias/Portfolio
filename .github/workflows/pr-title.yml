name: PR-Titel

on:
  pull_request:
    # "edited" sorgt dafür, dass ein korrigierter Titel neu geprüft wird
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Der PR-Titel wird beim Squash-Merge zur Commit-Message und steuert später die Version
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
