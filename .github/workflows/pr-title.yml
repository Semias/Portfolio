name: PR-Titel

on:
  pull_request:
    # "edited" sorgt dafür, dass ein korrigierter Titel neu geprüft wird
    types: [opened, edited, synchronize, reopened]
  # Für den Release-PR von Release Please (siehe deploy.yml), dessen Titel der Bot selbst setzt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Der PR-Titel wird beim Squash-Merge zur Commit-Message und steuert später die Version
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        run: echo "Release-PR von Release Please, der Titel kommt vom Bot"
