name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Für den Release-PR von Release Please (siehe deploy.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Nur Laufzeit-Abhängigkeiten: die bekannten Lücken stecken in den Vue-CLI-Dev-Tools
      - run: npm audit --omit=dev --audit-level=high
