name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Für den Release-PR von Release Please (siehe deploy.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Nur Laufzeit-Abhängigkeiten: die bekannten Lücken stecken in den Vue-CLI-Dev-Tools
      - run: npm audit --omit=dev --audit-level=high
